name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The off-vocal stem service base URL is NOT baked in at build time: the
      # site reads `public/stems-config.json` at runtime. The PC-hosted
      # Cloudflare quick tunnel gets a new URL every run, so
      # `stems-service/run-tunnel.ps1` updates that file and pushes it whenever
      # the tunnel restarts - no rebuild is needed for a URL change.
      - name: Build for GitHub Pages
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
